<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinguaRise</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #f5f5f5;
}

.container {
    max-width: 1100px;
    margin: auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    padding: 40px 20px;
}

.left {
    flex: 1;
    min-width: 300px;
}

.left img {
    width: 100%;
    border-radius: 10px;
}

.right {
    flex: 1;
    min-width: 300px;
    padding: 20px;
}

h1 {
    font-size: 40px;
    margin-bottom: 10px;
}

.subtitle {
    font-size: 18px;
    color: #555;
    margin-bottom: 30px;
}

.buttons {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}

.btn {
    padding: 15px 25px;
    font-size: 16px;
    text-decoration: none;
    border-radius: 5px;
    display: inline-block;
}

.btn-orange {
    background-color: #d97706;
    color: white;
}

.btn-blue {
    background-color: #1e3a8a;
    color: white;
}

.btn:hover {
    opacity: 0.9;
}

/* Mobile */
@media (max-width: 768px) {
    .container {
        flex-direction: column;
        text-align: center;
    }

    .right {
        padding: 10px;
    }

    h1 {
        font-size: 28px;
    }
}
</style>

</head>

<body>

<div class="container">

    <!-- LEFT IMAGE -->
    <div class="left">
        <img src="YOUR_IMAGE_LINK_HERE" alt="LinguaRise">
    </div>

    <!-- RIGHT CONTENT -->
    <div class="right">
        <p style="color: gray;">Cours d’anglais pour l’Amérique</p>

        <h1>ANGLAIS POUR L’AMÉRIQUE</h1>

        <p class="subtitle">
            Un parcours structuré pour apprendre l’anglais et réussir sa vie aux États-Unis.
        </p>

        <div class="buttons">
            <a href="YOUR_LEVELS_LINK_HERE" class="btn btn-orange">
                VOIR TOUS LES NIVEAUX
            </a>

            <a href="YOUR_CHECKOUT_LINK_HERE" class="btn btn-blue">
                START NOW
            </a>
        </div>
    </div>

</div>

</body>
</html>
